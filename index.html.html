 S.beds.forEach(function(sn,i){var l=latest(sn)||{};f.push({k:"l"+i,l:sn+" - location (type Store if in store)",v:l.loc||"Store",d:"loc",r:1},{k:"p"+i,l:sn+" - patient",o:names,v:l.pt||"(not mentioned)"},{k:"s"+i,l:sn+" - status / remarks",v:"Checked"})});
 form("Daily check - all beds",f,function(o){S.beds.forEach(function(sn,i){var pv=latest(sn),loc=o["l"+i],pt=o["p"+i],since="";
  if(loc.toLowerCase()!="store"){since=(pv&&!isS(pv)&&pv.pt==pt&&pv.since)?pv.since:o.date}else pt="";
  S.log.push({date:o.date,time:o.time,sn:sn,pt:pt,loc:loc,since:since,st:o["s"+i]||"Checked"})})})}
function repData(m){
 var ls=S.log.filter(function(l){return l.date.slice(0,7)==m}),days=mDays(m),cd={};ls.forEach(function(l){cd[l.date]=1});
 var beds=S.beds.map(function(sn){var mine=ls.filter(function(l){return l.sn==sn}),pt=mine.filter(function(l){return!isS(l)}),is=mine.filter(function(l){return/^issue/i.test(l.st)}),lastD="";
  mine.forEach(function(l){if(l.date>lastD)lastD=l.date});
  var est=days.filter(function(d){if(d>lastD)return false;var b=null;S.log.forEach(function(l){if(l.sn==sn&&l.date<=d&&(!b||l.date+l.time>=b.date+b.time))b=l});return b&&!isS(b)}).length;
  var u={};pt.forEach(function(l){u[l.date]=1});
  return{sn:sn,n:mine.length,p:pt.length,s:mine.length-pt.length,min:Object.keys(u).length,est:est,is:is}});
 var pm={};ls.forEach(function(l){if(isS(l))return;var k=l.pt+"|"+l.sn,o=pm[k];if(!o)o=pm[k]={pt:l.pt||"(name not given)",sn:l.sn,from:l.since||l.date,last:l.date,n:0};o.n++;if(l.date>o.last)o.last=l.date;if(l.since&&l.since<o.from)o.from=l.since});
 var pr=Object.keys(pm).map(function(k){var o=pm[k];o.f=o.from<m+"-01"?m+"-01":o.from;o.d=nd(o.last,o.f)+1;return o}).sort(function(a,b){return a.f<b.f?-1:1});
 return{cd:Object.keys(cd).length,n:ls.length,beds:beds,pr:pr,iss:ls.filter(function(l){return/^issue/i.test(l.st)})}}
function repV(){
 var cm=today.slice(0,7),ms={};ms[cm]=1;S.log.forEach(function(l){ms[l.date.slice(0,7)]=1});
 var m=rm||cm,r=repData(m),mn=new Date(m+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"});
 var t="SUSHRUT HOSPITAL - AIR BED REPORT - "+mn+"\nCheck days: "+r.cd+" | Total checks: "+r.n+" | Issues: "+r.iss.length+"\n\nPER AIR BED\n";
 r.beds.forEach(function(b){t+=b.sn+": checks "+b.n+", with patient "+b.p+", in store "+b.s+", days with patient "+b.min+" (seen) / "+b.est+" (estimated up to last check), issues "+b.is.length+"\n"});
 t+="\nPER PATIENT\n";
 if(!r.pr.length)t+="None\n";
 r.pr.forEach(function(o){t+=o.pt+" - "+o.sn+": "+fmt(o.f)+" to "+fmt(o.last)+" (min "+o.d+" days, "+o.n+" checks)\n"});
 t+="\nISSUES\n";if(!r.iss.length)t+="None\n";
 r.iss.forEach(function(l){t+=fmt(l.date)+" "+l.sn+": "+l.st+"\n"});
 var h='<div class="row"><select id="rm" style="flex:1">'+Object.keys(ms).sort().reverse().map(function(x){return'<option value="'+x+'"'+(x==m?" selected":"")+'>'+new Date(x+"-01").toLocaleDateString("en-GB",{month:"long",year:"numeric"})+'</option>'}).join("")+'</select><button class="btn" id="cp">Copy report</button><button class="btn" id="pf">PDF</button><button class="btn" id="xl">Excel</button></div>';
 h+='<div class="stats"><div><b>'+r.cd+'</b><span class="k">Check days</span></div><div><b>'+r.n+'</b><span class="k">Total checks</span></div><div><b>'+r.iss.length+'</b><span class="k">Issues</span></div></div>';
 h+='<div class="grid">'+r.beds.map(function(b){return'<div class="card"><h3>'+b.sn+'</h3><div class="k">Checks: '+b.n+' (patient '+b.p+' · store '+b.s+')</div><div>Days with patient: <b>'+b.min+'</b> seen</div><div class="k">~'+b.est+' days estimated up to last check</div>'+(b.is.length?'<div><span class="b i">'+b.is.length+' issue</span></div>':"")+'</div>'}).join("")+'</div>';
 h+='<h3 style="margin:16px 0 8px">Patients on air bed</h3>'+(r.pr.map(function(o){return'<div class="li"><div class="m"><b>'+esc(o.pt)+'</b> · '+o.sn+'<div class="k">'+fmt(o.f)+' → '+fmt(o.last)+' · min '+o.d+' day(s) · '+o.n+' checks</div></div></div>'}).join("")||'<div class="empty">No patient on air bed this month</div>');
 if(r.iss.length)h+='<h3 style="margin:16px 0 8px">Issues</h3>'+r.iss.map(function(l){return'<div class="li"><div class="m"><b>'+l.sn+'</b> · '+fmt(l.date)+'<div style="color:var(--er)">'+esc(l.st)+'</div></div></div>'}).join("");
 h+='<label>Report text</label><textarea id="rt" readonly rows="10" style="width:100%;font:13px/1.4 ui-monospace,monospace;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx)">'+esc(t)+'</textarea>';
 return h}
